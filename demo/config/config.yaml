# Supertext settings come from environment variables (Railway), never from this file.
supertext_translation:
    api_key: '%env(default::SUPERTEXT_API_KEY)%'
    environment: '%env(default:supertext_environment_default:SUPERTEXT_ENVIRONMENT)%'
    api_url: '%env(default::SUPERTEXT_API_URL)%'
    review_url: '%env(default:supertext_review_url_default:SUPERTEXT_REVIEW_URL)%'
    politeness:
        de-CH: more

parameters:
    supertext_environment_default: live
    supertext_review_url_default: 'https://localizationreview-production.up.railway.app/v1/'

contao:
    localconfig:
        adminEmail: 'demo@example.com'
